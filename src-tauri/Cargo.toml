[package]
name = "arona-chest"
version = "0.1.0"
description = "Arona Chest — borderless fullscreen local tile-wall shell (powered by MOMOKA Agent core)"
authors = ["Arona Chest"]
license = ""
repository = ""
default-run = "arona-chest"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# 多 webview（浏览器磁贴）需要 unstable feature；见 tauri v2 的 Webview::builder / Window::add_child
tauri = { version = "=2.11.5", features = ["unstable"] }

# Windows 系统通知：tauri 自带的 notification 在 target\debug|release 下会跳过 AppUserModelID，
# 未打包运行时不显示（静默丢弃）；这里自己维护 AUMID 并直接发 WinRT toast。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
winreg = "0.52"
